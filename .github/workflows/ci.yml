name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release job dispatches this workflow against the release PR's branch;
  # see "Validate the release pull request" below.
  workflow_dispatch:

# Jobs that need more ask for it themselves (the release job).
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  # PR and dispatched validation can be superseded safely. Main runs include
  # the release job, so cancelling one mid-publish could leave a partial release.
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  compatibility:
    name: Node ${{ matrix.node }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches the `engines.node` floor in package.json. Node 20 went EOL in
        # April 2026 and the repo's pnpm needs >=22.13, so the toolchain cannot
        # install or test on 20: claiming support for it would be untested.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit and package compatibility
        run: pnpm typecheck && pnpm test && pnpm build

  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs lint, typecheck, coverage-gated unit tests, build, publint, and
      # attw. The unit suite skips the Redis-backed integration tests because
      # BENNI_REDIS_URL is unset here; those run in the integration job.
      - name: Check
        run: pnpm check

      - name: Build public docs
        run: pnpm docs:build

  integration:
    name: Integration (Node + HTTP) against ${{ matrix.server }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every server the README's compatibility table claims, except
        # Dragonfly (checked by hand; see the README for why). Tests for
        # commands newer than a server are gated on the server reporting the
        # command, so the older rows run the suite for real rather than
        # skipping it: see test/server-commands.ts.
        include:
          - server: Redis 8
            image: redis:8-alpine
          # The lockfile pins ioredis 6, which every other row runs. ioredis 5
          # is still in the peer range and speaks only RESP2, where 6 has to
          # be pinned to it, so the lowest supported major gets its own run.
          - server: Redis 8, ioredis 5
            image: redis:8-alpine
            ioredis: "5"
          - server: Redis 7.4
            image: redis:7.4-alpine
          - server: Redis 7.2
            image: redis:7.2-alpine
          - server: Valkey 8
            image: valkey/valkey:8-alpine
    services:
      redis:
        image: ${{ matrix.image }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      serverless-redis-http:
        image: hiett/serverless-redis-http:latest
        ports:
          - 8079:80
        env:
          SRH_MODE: env
          SRH_TOKEN: example_token
          SRH_CONNECTION_STRING: redis://redis:6379
    env:
      BENNI_REDIS_URL: redis://127.0.0.1:6379
      BENNI_REDIS_CLUSTER_URL: redis://127.0.0.1:6381
      BENNI_UPSTASH_URL: http://127.0.0.1:8079
      BENNI_UPSTASH_TOKEN: example_token
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Throwaway: the lockfile on disk changes for this run only.
      - name: Swap in ioredis ${{ matrix.ioredis }}
        if: matrix.ioredis
        run: |
          pnpm add --save-dev --workspace-root "ioredis@${{ matrix.ioredis }}"
          node -e "console.log('ioredis', require('ioredis/package.json').version)"

      # A cluster-enabled node, started as a step rather than a `services:`
      # entry because cluster mode is a server flag and a service container
      # cannot override the image's command. Built from Dockerfile.cluster so
      # CI and `pnpm redis:cluster:run` are the same node, on the same server
      # as this row's standalone one.
      #
      # Without BENNI_REDIS_CLUSTER_URL the cluster suites skip, and a skipped
      # suite reads as a passing one: that is how an adapter bug that broke
      # every adopted ioredis.Cluster reached main. Slots are assigned here so
      # the cluster is routable before any file runs, rather than depending on
      # which suite happens to go first.
      - name: Start cluster-enabled ${{ matrix.server }}
        run: |
          docker build -f Dockerfile.cluster \
            --build-arg REDIS_IMAGE=${{ matrix.image }} -t benni-redis-cluster .
          docker run -d --name benni-redis-cluster -p 6381:6379 benni-redis-cluster
          for _ in $(seq 1 60); do
            docker exec benni-redis-cluster redis-cli ping >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec benni-redis-cluster redis-cli cluster addslotsrange 0 16383
          state=""
          for _ in $(seq 1 60); do
            state=$(docker exec benni-redis-cluster redis-cli cluster info \
              | tr -d '\r' | awk -F: '/^cluster_state:/{print $2}')
            [ "$state" = "ok" ] && break
            sleep 1
          done
          if [ "$state" != "ok" ]; then
            echo "cluster never reached cluster_state:ok (last: '$state')"
            docker logs benni-redis-cluster
            exit 1
          fi

      # With BENNI_REDIS_URL and BENNI_REDIS_CLUSTER_URL set, the full Vitest
      # suite runs the Node and cluster integration tests against the services
      # above as well as the unit tests.
      - name: Node integration tests
        run: pnpm test

      - name: Runnable Node example
        if: matrix.image == 'redis:8-alpine' && !matrix.ioredis
        run: pnpm example:node

  bun:
    name: Bun ${{ matrix.bun }} contract tests against Redis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pinned, not "latest": Bun 1.4.0 changed the error code a server
        # reply carries, and an unpinned runner would have surfaced that as a
        # red main with no change on our side. The lowest supported version
        # and the current one; bump the second when a new Bun is verified.
        bun: ["1.3.14", "1.4.2"]
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BENNI_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bun contract tests
        run: pnpm test:bun

  deno:
    name: Deno compatibility against Redis
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BENNI_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies and build package
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Deno Node-adapter smoke test
        run: |
          deno check --node-modules-dir=manual test/deno.integration.mjs
          deno run --node-modules-dir=manual --allow-env --allow-net test/deno.integration.mjs

  release:
    name: Version or publish after all gates pass
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [compatibility, check, integration, bun, deno]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # npm trusted publishing: the job's OIDC token is exchanged for a
      # short-lived publish token, and provenance is attached automatically
      # because the repo and package are public. No NPM_TOKEN secret.
      #
      # OWNER-ONLY SETUP, not expressible in this file: on npmjs.com, package
      # benni -> Settings -> Trusted Publisher -> GitHub Actions, with
      # organization/user "ChiChuRita", repository "benni", workflow filename
      # "ci.yml", no environment, and `npm publish` allowed. Until that exists
      # the token exchange fails and the publish is rejected, so configure it
      # before merging a release PR. The NPM_TOKEN secret can then be deleted.
      id-token: write
      # To dispatch this workflow against the release PR's branch.
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # No `registry-url`: that writes an .npmrc whose auth token is
      # ${NODE_AUTH_TOKEN}, which trusted publishing leaves unset.
      #
      # The publish itself is `changeset publish` -> `pnpm publish`, and pnpm
      # (11.9, from packageManager) does the OIDC exchange and provenance
      # natively; it has since 11.1.3. npm documents trusted publishing as
      # needing npm >= 11.5.1 and Node >= 22.14 when npm publishes; Node 24
      # ships an npm past that, so a switch to `npm publish` would hold too.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # changesets/action@v1 (1.6+) writes no npm auth when NPM_TOKEN is unset
      # and OIDC is available, which is what lets trusted publishing through.
      - name: Create release pull request or publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          title: "Release Benni"
          commit: "Release Benni"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The release PR is opened and updated with GITHUB_TOKEN, and since June
      # 2026 GitHub holds a pull_request run triggered by github-actions[bot]
      # for a maintainer's approval instead of starting it. Unapproved, it
      # expires after 30 days as a jobless failure ("This run likely failed
      # because of a workflow file issue"), which is what happened to PR #6: the
      # release PR never ran a check. workflow_dispatch is exempt from that
      # hold, and a dispatched run reports its checks on the branch's head
      # commit, which is the PR's head. The held pull_request run still shows up
      # as awaiting approval; it can be ignored, or approved to run it twice.
      #
      # TODO: dispatch is the no-setup fix. Opening the PR with a GitHub App
      # token (actions/create-github-app-token, passed as this step's
      # GITHUB_TOKEN) would make the pull_request run start normally and drop
      # this step, at the cost of an app the owner creates and two secrets.
      - name: Validate the release pull request
        if: steps.changesets.outputs.pullRequestNumber
        run: gh workflow run ci.yml --ref changeset-release/main
        env:
          GH_TOKEN: ${{ github.token }}
