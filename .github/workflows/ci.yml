name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  # PR validation can be superseded safely. Main runs include the release job,
  # so cancelling one mid-publish could leave a partial release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compatibility:
    name: Node ${{ matrix.node }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches the `engines.node` floor in package.json. Node 20 went EOL in
        # April 2026 and the repo's pnpm needs >=22.13, so the toolchain cannot
        # install or test on 20: claiming support for it would be untested.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit and package compatibility
        run: pnpm typecheck && pnpm test && pnpm build

  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs lint, typecheck, coverage-gated unit tests, build, publint, and
      # attw. The unit suite skips the Redis-backed integration tests because
      # BENNI_REDIS_URL is unset here; those run in the integration job.
      - name: Check
        run: pnpm check

      - name: Build public docs
        run: pnpm docs:build

  integration:
    name: Integration (Node + Bun + HTTP) against Redis
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      serverless-redis-http:
        image: hiett/serverless-redis-http:latest
        ports:
          - 8079:80
        env:
          SRH_MODE: env
          SRH_TOKEN: example_token
          SRH_CONNECTION_STRING: redis://redis:6379
    env:
      BENNI_REDIS_URL: redis://127.0.0.1:6379
      BENNI_REDIS_CLUSTER_URL: redis://127.0.0.1:6381
      BENNI_UPSTASH_URL: http://127.0.0.1:8079
      BENNI_UPSTASH_TOKEN: example_token
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A cluster-enabled node, started as a step rather than a `services:`
      # entry because cluster mode is a server flag and a service container
      # cannot override the image's command. Built from Dockerfile.cluster so
      # CI and `pnpm redis:cluster:run` are the same node.
      #
      # Without BENNI_REDIS_CLUSTER_URL the cluster suites skip, and a skipped
      # suite reads as a passing one: that is how an adapter bug that broke
      # every adopted ioredis.Cluster reached main. Slots are assigned here so
      # the cluster is routable before any file runs, rather than depending on
      # which suite happens to go first.
      - name: Start cluster-enabled Redis
        run: |
          docker build -f Dockerfile.cluster -t benni-redis-cluster .
          docker run -d --name benni-redis-cluster -p 6381:6379 benni-redis-cluster
          for _ in $(seq 1 60); do
            docker exec benni-redis-cluster redis-cli ping >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec benni-redis-cluster redis-cli cluster addslotsrange 0 16383
          state=""
          for _ in $(seq 1 60); do
            state=$(docker exec benni-redis-cluster redis-cli cluster info \
              | tr -d '\r' | awk -F: '/^cluster_state:/{print $2}')
            [ "$state" = "ok" ] && break
            sleep 1
          done
          if [ "$state" != "ok" ]; then
            echo "cluster never reached cluster_state:ok (last: '$state')"
            docker logs benni-redis-cluster
            exit 1
          fi

      # With BENNI_REDIS_URL and BENNI_REDIS_CLUSTER_URL set, the full Vitest
      # suite runs the Node and cluster integration tests against the services
      # above as well as the unit tests.
      - name: Node integration tests
        run: pnpm test

      - name: Runnable Node example
        run: pnpm example:node

      - name: Bun contract tests
        run: pnpm test:bun

  deno:
    name: Deno compatibility against Redis
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BENNI_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies and build package
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Deno Node-adapter smoke test
        run: |
          deno check --node-modules-dir=manual test/deno.integration.mjs
          deno run --node-modules-dir=manual --allow-env --allow-net test/deno.integration.mjs

  release:
    name: Version or publish after all gates pass
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [compatibility, check, integration, deno]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release pull request or publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
          title: "Release Benni"
          commit: "Release Benni"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
